# nginx as the load balancer and static-asset server in front of the app tier.
#
# Two jobs:
#   1. Spread candidate traffic across the app instances (they're stateless, so
#      any request can go to any instance — no sticky sessions needed).
#   2. Serve /uploads (logos, question images) straight off disk, keeping tens
#      of thousands of image requests off the JVM entirely.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Because the API is stateless (JWT), least_conn spreads load evenly with no
    # affinity. Add instances here and reload — that is the whole scale-out step.
    upstream exam_app {
        least_conn;
        server app1:8080 max_fails=3 fail_timeout=15s;
        server app2:8080 max_fails=3 fail_timeout=15s;
        server app3:8080 max_fails=3 fail_timeout=15s;
        keepalive 256;
    }

    # Soak up bursts: the answer/clock endpoints are cheap, so allow a high rate
    # per client before the leaky bucket pushes back.
    limit_req_zone $binary_remote_addr zone=api:20m rate=40r/s;

    server {
        listen 80;
        client_max_body_size 30m;

        # Uploaded assets — served directly, shared across the fleet by volume.
        location /uploads/ {
            alias /srv/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Health probe passes straight through, unthrottled.
        location = /health {
            proxy_pass http://exam_app;
        }

        location / {
            limit_req zone=api burst=80 nodelay;

            proxy_pass http://exam_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
