# ─────────────────────────────────────────────────────────────────────────────
#  Online examination platform, mounted at /online
# ─────────────────────────────────────────────────────────────────────────────
#  Copy to /etc/nginx/snippets/exam-online.conf and include it INSIDE the
#  existing server block for the site, e.g.:
#
#      include /etc/nginx/snippets/exam-online.conf;
#
#  Kept as a file in the repository rather than pasted into a terminal: a
#  half-pasted nginx block is a broken site, and long heredocs truncate.
#
#  nginx matches the longest prefix first, so /online/api/ is chosen over
#  /online/ regardless of the order these appear in.
# ─────────────────────────────────────────────────────────────────────────────

location /online/api/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;

    # The login rate limiter identifies a client from this header. Without it
    # an entire exam hall behind one NAT address counts as a single client,
    # and the eleventh candidate to sign in would be locked out.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A question paper with diagrams can take a while to parse. These sit well
    # above the application's own timeouts so nginx is never the component
    # that gives up first, which would look like data loss to an admin.
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}

# Question diagrams and college logos, written at runtime by the application
# and therefore not part of the static bundle.
location /online/uploads/ {
    proxy_pass http://127.0.0.1:8080/uploads/;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public";
}

# Without this, /online with no trailing slash falls through to the host
# site's catch-all and quietly serves the wrong page.
location = /online {
    return 301 /online/;
}

location /online/ {
    alias /var/www/exam-frontend/;

    # React Router owns every path below /online. Anything that is not a real
    # file goes to the app, so refreshing mid-exam, or a candidate opening the
    # link they were given, reaches the app instead of an nginx 404.
    try_files $uri $uri/ /online/index.html;
}
