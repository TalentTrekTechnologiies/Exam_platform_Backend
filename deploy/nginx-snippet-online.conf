# ─────────────────────────────────────────────────────────────────────────────
#  Online examination platform, mounted at /online
# ─────────────────────────────────────────────────────────────────────────────
#  Static files must live in a directory named `online` under the root below,
#  i.e. /var/www/exam/online/ — see the root directive at the bottom.
#
#  Copy to /etc/nginx/snippets/exam-online.conf and include it INSIDE the
#  existing server block for the site, e.g.:
#
#      include /etc/nginx/snippets/exam-online.conf;
#
#  Kept as a file in the repository rather than pasted into a terminal: a
#  half-pasted nginx block is a broken site, and long heredocs truncate.
#
#  nginx matches the longest prefix first, so /online/api/ is chosen over
#  /online/ regardless of the order these appear in.
#
#  The ^~ on each prefix is load-bearing, not decoration. A host site that
#  optimises static assets almost always carries a regex location matching file
#  extensions, and in nginx a matching REGEX beats a matching prefix. Without
#  ^~, every request under /online ending in .html, .js, .css or .svg is
#  captured by that regex and resolved against the HOST site's root, while
#  extensionless paths like /online/api/health quietly keep working — so the
#  API succeeds, every page 404s, and the config looks correct while being
#  entirely bypassed. ^~ stops regex evaluation once the prefix matches.
# ─────────────────────────────────────────────────────────────────────────────

location ^~ /online/api/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;

    # The login rate limiter identifies a client from this header. Without it
    # an entire exam hall behind one NAT address counts as a single client,
    # and the eleventh candidate to sign in would be locked out.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A question paper with diagrams can take a while to parse. These sit well
    # above the application's own timeouts so nginx is never the component
    # that gives up first, which would look like data loss to an admin.
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}

# Question diagrams and college logos, written at runtime by the application
# and therefore not part of the static bundle.
location ^~ /online/uploads/ {
    proxy_pass http://127.0.0.1:8080/uploads/;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public";
}

# Without this, /online with no trailing slash falls through to the host
# site's catch-all and quietly serves the wrong page.
location = /online {
    return 301 /online/;
}

# The hashed bundles. Their names change whenever their contents do, so they
# can be kept forever — and should be, because an exam hall of machines
# re-fetching the whole app on the morning is bandwidth spent for nothing.
location ^~ /online/assets/ {
    root /var/www/exam;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# index.html, on the other hand, must NEVER be cached.
#
# It is the one file that names which hashed bundle to load. A browser holding
# yesterday's copy keeps loading yesterday's application — and after a deploy
# that removed the old bundles, it loads nothing at all and the page is blank.
# Neither failure says anything useful: the server is healthy, the files are
# right, and only that one machine is wrong.
#
# nginx sends no Cache-Control of its own here, so browsers fall back to
# heuristic caching off Last-Modified — which is precisely the silent staleness
# this prevents.
location = /online/index.html {
    root /var/www/exam;
    add_header Cache-Control "no-store, must-revalidate";
    expires -1;
}

location ^~ /online/ {
    # `root`, deliberately, not `alias`.
    #
    # try_files and alias do not compose: try_files resolves against the alias
    # as though it were a document root and rebuilds the already-stripped
    # prefix, so /online/index.html is looked for at
    # /var/www/exam/online/online/index.html and every route 404s while the API
    # beside it works perfectly — a confusing failure to read.
    #
    # With `root`, the URI is appended to the path unchanged, so the files
    # simply live in a directory named `online` and everything resolves.
    root /var/www/exam;

    # React Router owns every path below /online. Anything that is not a real
    # file goes to the app, so refreshing mid-exam, or a candidate opening the
    # link they were given, reaches the app instead of an nginx 404.
    try_files $uri $uri/ /online/index.html;
}
