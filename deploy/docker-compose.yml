# Full exam-day stack: one MySQL, three stateless app instances, one nginx
# load balancer. Scale the app tier by adding instances and an upstream line.
#
#   cp .env.example .env   # then set JWT_SECRET and DB_PASSWORD
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The whole platform is then on http://localhost — nginx fans out to the three
# app containers, MySQL is not exposed off the compose network.

name: exam-platform

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: exam_system
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # MUST match the app's timezone below.
      #
      # The exam clock is written by MySQL, not Java: AttemptService sets
      # end_time = DATE_ADD(NOW(), INTERVAL duration MINUTE) using the
      # DATABASE's clock, while the remaining-time endpoint compares it against
      # the APP's clock. If the two disagree the difference lands directly on
      # every candidate's timer — on a UTC host with an IST app, a candidate
      # would start their exam and be told the time had already run out.
      #
      # A host left on UTC is the normal case for a VPS, so this cannot be left
      # to inherit from the host.
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql-tuning.cnf:/etc/mysql/conf.d/tuning.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host — only the app tier reaches it.
    expose:
      - "3306"

  # Three identical, stateless instances. YAML anchors keep them in sync.
  app1: &app
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/exam_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-validate}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-50}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TZ: Asia/Kolkata
    volumes:
      # All instances share one uploads directory, so a logo uploaded via one
      # instance is visible to every other instance and to nginx.
      - uploads:/app/uploads
    expose:
      - "8080"

  app2:
    <<: *app

  app3:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app1
      - app2
      - app3
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Read-only view of the same uploads volume the app writes to.
      - uploads:/srv/uploads:ro

volumes:
  db-data:
  uploads:
