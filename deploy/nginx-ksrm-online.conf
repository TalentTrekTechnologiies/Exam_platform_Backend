# ─────────────────────────────────────────────────────────────────────────────
#  Serving the exam platform at ksrmce.ac.in/online
#  alongside the existing KSRM website at ksrmce.ac.in
# ─────────────────────────────────────────────────────────────────────────────
#
#  The KSRM site already lives on this VPS. This adds two locations to its
#  existing server block WITHOUT touching how the main site is served:
#
#     ksrmce.ac.in/            -> the KSRM website  (unchanged)
#     ksrmce.ac.in/online      -> the exam frontend (static files)
#     ksrmce.ac.in/online/api  -> the exam backend  (Spring Boot on :8080)
#
#  Put the two `location` blocks below into the EXISTING server block for
#  ksrmce.ac.in. Do not create a second server block for the same name — nginx
#  would pick one and silently ignore the other.
#
#  Order matters: nginx matches the longest prefix first, so /online/api is
#  evaluated before /online. Keeping them in this order also keeps it readable.

    # ── Exam backend ────────────────────────────────────────────────────────
    # Must come BEFORE the /online block below.
    #
    # The trailing slash on proxy_pass strips the /online/api prefix, so the
    # backend sees /admin/login rather than /online/api/admin/login and needs
    # no knowledge of where it is mounted.
    location /online/api/ {
        proxy_pass http://127.0.0.1:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The rate limiter reads the first entry of this to identify a client.
        # Without it every candidate looks like the proxy itself, and one lab
        # would exhaust the limit for everyone in it.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Question papers with diagrams are the large uploads here; the app
        # itself caps at 25MB, so this only needs to not be the tighter limit.
        client_max_body_size 30m;

        # A slow import must not be cut off mid-parse. Kept well above the
        # app's own timeouts so nginx is never the thing that gives up first.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Uploaded images (question diagrams, college logos) ──────────────────
    # Served straight from the backend rather than the static bundle, because
    # they are written at runtime and are not part of any build.
    location /online/uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Exam frontend ───────────────────────────────────────────────────────
    # Build it with VITE_BASE_PATH=/online/ so every asset URL already carries
    # the prefix, then copy dist/ to the path below.
    location /online {
        alias /var/www/exam-frontend/;

        # React Router owns every path under /online. try_files hands anything
        # that is not a real file to index.html so a refresh on /online/exam,
        # or a candidate opening their link directly, reaches the app instead
        # of an nginx 404.
        try_files $uri $uri/ /online/index.html;

        # Hashed filenames can be cached hard. index.html must NOT be, or a
        # redeploy leaves browsers holding a stale app that points at assets
        # which no longer exist.
        location ~* \.(js|css|woff2|png|jpg|jpeg|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /online/index.html {
            expires -1;
            add_header Cache-Control "no-store, must-revalidate";
        }
    }

# ─────────────────────────────────────────────────────────────────────────────
#  Deploying
# ─────────────────────────────────────────────────────────────────────────────
#
#  1. Backend (on the VPS):
#       cd /opt/exam/deploy
#       cp .env.example .env && nano .env        # JWT_SECRET, DB_PASSWORD, seed admin
#       docker compose up -d --build
#       curl localhost:8080/health               # {"status":"UP","db":"UP"}
#
#     Set these in .env so links and CORS point at the real address:
#       CANDIDATE_BASE_URL=https://ksrmce.ac.in/online
#       CORS_ORIGINS=https://ksrmce.ac.in
#
#     CORS_ORIGINS is the SITE origin with no path — a browser sends the origin
#     only, never the path, so "https://ksrmce.ac.in/online" would never match
#     and every request would be blocked.
#
#  2. Frontend (built anywhere, uploaded to the VPS):
#       VITE_BASE_PATH=/online/ \
#       VITE_API_URL=https://ksrmce.ac.in/online/api \
#       VITE_INSTITUTION_CODE=ksrm-college \
#       VITE_ALLOW_REGISTRATION=false \
#       VITE_PLATFORM_NAME="KSRM Examinations" \
#       npm run build
#
#       scp -r dist/* root@VPS:/var/www/exam-frontend/
#
#  3. nginx:
#       nginx -t && systemctl reload nginx
#
#  4. Check, in this order — each rules out a different layer:
#       curl https://ksrmce.ac.in/online/api/health     # backend reachable
#       curl -I https://ksrmce.ac.in/online/            # frontend served
#       open  https://ksrmce.ac.in/online/admin/login   # app actually runs
#       open  https://ksrmce.ac.in/                     # KSRM site still fine
#
#  5. Point the CMS sidebar at it, in the KSRM site's own config:
#       site-config.json -> "examAdminUrl": "https://ksrmce.ac.in/online"
#
# ─────────────────────────────────────────────────────────────────────────────
#  Timezone — worth setting before the first exam
# ─────────────────────────────────────────────────────────────────────────────
#
#  A VPS usually runs UTC while the college works in IST. Exam slots are stored
#  and compared as local server time, so a 9:00 AM slot on a UTC box opens at
#  2:30 PM IST and every candidate is turned away. Fix it once, on the host:
#
#       timedatectl set-timezone Asia/Kolkata
#
#  docker-compose.yml already passes TZ=Asia/Kolkata to the app, so the
#  container agrees with the host once this is set.
