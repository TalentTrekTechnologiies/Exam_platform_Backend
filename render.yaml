# Render Blueprint for the exam backend.
#
# Optional convenience — Render's dashboard flow (New → Web Service → connect
# this repo) works without this file and is the path documented step-by-step in
# deploy/RENDER.md, which is the authoritative source if this file and the
# dashboard ever disagree. Render's Blueprint schema changes over time; treat
# this as a starting point to review in the dashboard, not a blind "Apply".
#
# Secrets (sync: false) are never set here — Render prompts for them once and
# stores them outside the repo. Nothing here is committed with a real value.

services:
  - type: web
    name: exam-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # ── Required ──────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false          # openssl rand -base64 48
      - key: DB_URL
        sync: false          # jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED&serverTimezone=Asia/Kolkata
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ── Schema ────────────────────────────────────────────────────────────
      # 'update' for the very first deploy so tables get created, then switch
      # to 'validate' in the dashboard and redeploy.
      - key: DDL_AUTO
        value: update

      # ── Where the app is reached ──────────────────────────────────────────
      - key: CORS_ORIGINS
        sync: false          # the deployed frontend's Render URL + the KSRM domain
      - key: CANDIDATE_BASE_URL
        sync: false          # the deployed frontend's Render URL

      # ── Deployment mode: dedicated KSRM install ──────────────────────────
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_COLLEGE
        sync: false
      - key: SEED_ADMIN_CODE
        sync: false          # must equal the frontend's VITE_INSTITUTION_CODE

      # ── Email: off until an SMTP account is wired up (costs nothing to leave off) ──
      - key: MAIL_ENABLED
        value: "false"

      # ── Fits the free instance's 512MB ──────────────────────────────────────
      # The Dockerfile's default JAVA_OPTS (-XX:MaxRAMPercentage=75) assumes a
      # real server with several GB, which is correct for the VPS/exam-day path
      # in docker-compose.yml but oversized here — on Render's free 512MB
      # instance the JVM's own bookkeeping (metaspace, thread stacks, GC
      # structures) on top of a 75%-of-container heap estimate is enough to get
      # the whole container OOM-killed before Spring Boot finishes starting.
      # An explicit, conservative cap avoids that; likewise the connection pool
      # and thread count, which were sized for a real sitting, not a free tier.
      - key: JAVA_OPTS
        value: "-Xmx300m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      - key: DB_POOL_SIZE
        value: "5"
      - key: TOMCAT_THREADS
        value: "20"
