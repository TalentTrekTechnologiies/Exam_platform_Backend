spring.application.name=Exam_System

# ── Server ──────────────────────────────────────────────────────────────────
# PaaS platforms (Render, Heroku, Railway) assign the port at deploy time and
# pass it as $PORT — the app must bind to whatever it is handed, not assume
# 8080. Without this, Spring Boot always binds 8080, the platform's health
# check hits the port IT assigned, gets nothing back, and the deploy fails
# with no obvious cause. 8080 stays the default for local dev and Docker
# Compose, where nothing sets PORT.
server.port=${PORT:8080}

# ── Database ────────────────────────────────────────────────────────────────
# Credentials come from the environment; the defaults are local-dev only.
# Never ship a build with real credentials baked into this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/exam_system?useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# `update` is fine while the schema is still moving. Switch to `validate` before
# any real exam and manage schema changes with migrations instead.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# ── Throughput tuning ───────────────────────────────────────────────────────
# Connection pool sized for a hall of concurrent candidates. The pool is the
# real ceiling under load, so it is the first thing to raise per instance — but
# keep (instances x pool) below MySQL's max_connections. A single box comfortably
# runs 50; behind a load balancer, tune down per instance so the fleet stays
# within the database's limit.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:50}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
# Generous on purpose. At slot-open thousands of candidates start within the same
# few seconds and the pool queue gets deep. A candidate waiting three seconds for
# their paper is a non-event; one seeing "could not start your exam" is not. Let
# the burst queue and drain rather than fail.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.pool-name=ExamHikari

# Tomcat worker threads. The workload is many short requests (answer saves, clock
# polls), so accept a generous queue rather than rejecting bursts at slot-open.
server.tomcat.threads.max=${TOMCAT_THREADS:300}
server.tomcat.threads.min-spare=25
server.tomcat.accept-count=200
server.tomcat.max-connections=10000

# Hibernate batching. AttemptQuestion inserts are batched directly via JDBC
# (IDENTITY ids can't be Hibernate-batched), but the submit path re-grades many
# Answer rows with UPDATEs, and those DO batch.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ── Uploads ─────────────────────────────────────────────────────────────────
# Serve uploaded logos/diagrams under an explicit prefix. The previous
# static-path-pattern of /** published the entire uploads directory at the web
# root and shadowed the API routes.
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.mvc.static-path-pattern=/uploads/**

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

# ── CORS ────────────────────────────────────────────────────────────────────
# Comma-separated. Vite dev server runs on 3000 per vite.config.js.
# 5174 is the exam frontend's dev port (3000 belongs to the KSRM CMS dev server).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5174,http://localhost:5173,http://localhost:3000}

# ── Auth ────────────────────────────────────────────────────────────────────
# MUST be overridden in any real deployment. Anyone holding this value can mint
# admin tokens for every institution on the server.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-32ch}
app.jwt.admin-ttl-hours=${ADMIN_TOKEN_HOURS:8}
app.jwt.student-ttl-hours=${STUDENT_TOKEN_HOURS:6}

# Optional first-run admin. Leave the password unset to register manually.
# On a dedicated install (registration disabled) this is the ONLY way in, so it
# must describe the real institution — the code especially, which has to match
# the frontend's VITE_INSTITUTION_CODE or every candidate sign-in is refused.
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@example.edu}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.admin-college=${SEED_ADMIN_COLLEGE:Default Institution}
app.seed.admin-code=${SEED_ADMIN_CODE:}

# ── Errors ──────────────────────────────────────────────────────────────────
# Stack traces must never reach a candidate's browser.
server.error.include-stacktrace=never
server.error.include-message=never

# ── Deployment mode ─────────────────────────────────────────────────────────
# false for a dedicated single-institution install (KSRM's own exam module):
# staff accounts are created by the institution, never self-registered.
# true for the shared platform where colleges sign themselves up.
app.registration.enabled=${ALLOW_REGISTRATION:true}

# ── Candidate entrance ──────────────────────────────────────────────────────
# Public origin candidates reach the exam on, used to build the shareable link
# an exam officer hands out. The server cannot infer this itself when it sits
# behind a proxy or a different hostname.
app.candidate-base-url=${CANDIDATE_BASE_URL:http://localhost:5174}

# ── Email ───────────────────────────────────────────────────────────────────
# Provider-agnostic SMTP. Works unchanged with a college Google Workspace or
# Microsoft 365 account, Brevo/Mailjet free tiers, or Amazon SES — only these
# values change. All of those have a free option, so email costs nothing.
#
# Left blank by default and that is a supported state: the app still QUEUES mail
# (hall tickets, exam links) into the outbox so the whole flow can be built and
# rehearsed, and simply does not send until a host is configured.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Don't hang a whole drain batch on one unreachable server.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Turns actual sending on. The address candidates see mail arrive from — on a
# dedicated install this should be the institution's own, e.g. exams@ksrm.edu.in,
# so it reads as coming from the college.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Examinations}
# Per drain tick. Deliberately low — being slow is recoverable, being flagged as
# a spam source is not. Raise only with a provider that tolerates it (e.g. SES).
app.mail.batch-size=${MAIL_BATCH_SIZE:25}
